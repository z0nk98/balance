<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self' https://ntfy.sh">
  <meta name="referrer" content="no-referrer">
  <title>My Balance</title>
  <link rel="stylesheet" href="style.css?v=92336508b1">
  <link rel="stylesheet" href="lending.css?v=92336508b1">
</head>
<body>
  <header class="topbar">
    <h1>My Balance</h1>
    <button id="logout" hidden>Sign out</button>
  </header>

  <main>
    <section id="loginView" class="card narrow" hidden>
      <h2>Enter your access code</h2>
      <p>Enter the code you were given to see your payment schedule and due dates.</p>
      <form id="loginForm" autocomplete="off">
        <input id="code" class="code-input" placeholder="Your access code" maxlength="44" required autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Access code">
        <label class="check remember"><input type="checkbox" id="rememberCode" checked> Remember my code on this device</label>
        <button type="submit" class="primary" id="loginBtn">View my balance</button>
      </form>
      <p id="loginError" class="error" hidden></p>
    </section>

    <div id="mainView" hidden>
      <p id="greeting"></p>

      <section class="stats four">
        <div class="stat">
          <span class="stat-label">Total remaining</span>
          <span class="stat-value" id="remaining"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Overdue</span>
          <span class="stat-value" id="overdue"></span>
        </div>
        <div class="stat">
          <span class="stat-label" id="dueSoonLabel">Due soon</span>
          <span class="stat-value" id="dueSoon"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Next payment</span>
          <span class="stat-value" id="nextDue"></span>
          <span class="stat-sub" id="nextDueDate"></span>
        </div>
      </section>

      <section class="card" id="paySection" hidden>
        <h2>How to pay</h2>
        <div id="payMethods" class="pay-list"></div>
      </section>

      <section class="card">
        <h2>My payments</h2>
        <div class="filters">
          <div class="chips" id="statusFilter" role="group" aria-label="Filter by status">
            <button type="button" data-status="unpaid" class="chip active">Unpaid</button>
            <button type="button" data-status="overdue" class="chip">Overdue</button>
            <button type="button" data-status="due-soon" class="chip">Due soon</button>
            <button type="button" data-status="paid" class="chip">Paid</button>
            <button type="button" data-status="all" class="chip">All</button>
          </div>
          <div class="filter-selects">
            <label id="loanFilterWrap">Loan
              <select id="loanFilter"><option value="">All loans</option></select>
            </label>
            <label>Month
              <select id="monthFilter"><option value="">All months</option></select>
            </label>
            <label>Sort by
              <select id="sortBy">
                <option value="date">Due date</option>
                <option value="note-asc">Loan name A–Z</option>
                <option value="note-desc">Loan name Z–A</option>
              </select>
            </label>
            <label>Search loans
              <input id="noteSearch" type="search" maxlength="60" placeholder="e.g. phone, 2/6" autocomplete="off">
            </label>
            <button type="button" id="clearFilters" class="linkish" hidden>Clear filters</button>
          </div>
          <p id="filterSummary" class="hint"></p>
        </div>
        <div id="months"></div>
        <p id="monthsEmpty" class="empty" hidden>No payments match these filters.</p>
      </section>

      <section class="card">
        <h2>Payment reminders</h2>
        <p id="reminderStatus"></p>
        <p class="hint" id="reminderHint"></p>
        <form id="contactForm" class="contact-form" autocomplete="on" hidden>
          <label>Email
            <input id="contactEmail" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email">
          </label>
          <label>Mobile number
            <input id="contactPhone" type="tel" maxlength="20" placeholder="0917 123 4567" autocomplete="tel">
          </label>
          <div class="btn-row wide">
            <label class="check"><input type="checkbox" id="wantEmail"> Email me</label>
            <label class="check"><input type="checkbox" id="wantSms"> Text me</label>
          </div>
          <div class="wide">
            <button type="submit" class="primary" id="contactSend">Send to <span id="contactOwner">lender</span></button>
          </div>
        </form>
        <p id="contactMsg" hidden></p>
      </section>
    </div>
  </main>

  <script src="lib/icons.js?v=92336508b1"></script>
  <script src="lib/core.js?v=92336508b1"></script>
  <script src="borrow.js?v=92336508b1"></script>
</body>
</html>
