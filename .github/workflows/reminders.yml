name: Payment reminders

on:
  schedule:
    # Every day at 15:23 UTC (morning in the Americas, evening in Europe).
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the site repo has data; in the source repo there's nothing to do.
      - uses: actions/setup-node@v4
        if: hashFiles('data/owner.json') != ''
        with:
          node-version: 20
      - name: Send reminders
        if: hashFiles('data/owner.json') != ''
        run: node scripts/remind.js
        env:
          # Due dates are compared using this time zone (e.g. America/New_York).
          TZ: ${{ vars.TIMEZONE || 'UTC' }}
          OWNER_PASSPHRASE: ${{ secrets.OWNER_PASSPHRASE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ vars.TWILIO_FROM }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
