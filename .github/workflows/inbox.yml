name: Save borrower updates

on:
  schedule:
    # Hourly; ntfy.sh keeps messages for about 12 hours.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the site repo has data; in the source repo there's nothing to do.
      - uses: actions/setup-node@v4
        if: hashFiles('data/owner.json') != ''
        with:
          node-version: 20
      - name: Save new updates
        if: hashFiles('data/owner.json') != ''
        run: node scripts/inbox.js
        env:
          OWNER_PASSPHRASE: ${{ secrets.OWNER_PASSPHRASE }}
      - name: Commit
        if: hashFiles('data/owner.json') != ''
        run: |
          [ -d data/inbox ] || exit 0
          git add data/inbox
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save borrower updates'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
